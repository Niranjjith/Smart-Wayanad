name: smart_wayanad
description: Smart Wayanad Citizen App
publish_to: "none"

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # 🌐 Networking + APIs
  http: ^1.2.2

  # 📍 Location access
  geolocator: ^13.0.1

  # 💬 Notifications (works on Android/iOS, not Windows)
  fluttertoast: ^8.2.4

  # 🧠 State management
  provider: ^6.1.2

  # 🖋 Google Fonts for a clean look
  google_fonts: ^6.2.1

  # 🔗 External link launcher
  url_launcher: ^6.3.0

  # ⚡ Real-time updates (for chat/help alerts)
  socket_io_client: ^2.0.3+1

  # 🎡 Loading animations / spinners
  flutter_spinkit: ^5.2.0

  # 🗺️ Maps and location
  google_maps_flutter: ^2.5.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  mapbox_gl: ^0.15.0

  # 📸 Image picker
  image_picker: ^1.0.7

  # 🎤 Voice recording (optional - not available on Windows/Linux)
  # record: ^5.0.4  # Commented out due to Windows compatibility issues
  permission_handler: ^11.3.0

  # 🌙 Dark mode
  shared_preferences: ^2.2.2

  # 📱 AR (camera-based navigation)
  camera: ^0.10.5+5

  # 🎨 UI enhancements
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/LOGO.png
    - assets/bg.jpg
